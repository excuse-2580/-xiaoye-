<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小夜的扩列小窝 · 🌟</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg1:#cdeafd; --bg2:#e7f6ef; --bg3:#fde9f3;
    --card:rgba(255,255,255,.66); --ink:#36495a; --soft:#708498;
    --accent:#6fb7e8; --accent2:#7fd6b0; --warn:#ff9b9b; --pink:#ffb6d5;
    --line:rgba(120,150,170,.18);
  }
  html{ scroll-behavior:smooth; }
  html,body{ min-height:100%; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    background-attachment:fixed;
    padding:0 14px 70px; line-height:1.7;
  }
  .nav{
    position:sticky; top:0; z-index:50; margin:0 -14px 14px;
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding:10px 12px; backdrop-filter:blur(12px);
    background:rgba(255,255,255,.55); border-bottom:1px solid var(--line);
  }
  .nav a{
    font-size:12px; color:var(--ink); text-decoration:none;
    background:rgba(255,255,255,.7); padding:5px 12px; border-radius:18px;
    border:1px solid var(--line); transition:.18s; white-space:nowrap;
  }
  .nav a:hover{ background:#fff; transform:translateY(-2px); box-shadow:0 4px 10px rgba(120,170,210,.3); }
  .wrap{ max-width:680px; margin:0 auto; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  .reveal{ opacity:0; animation:fadeUp .7s ease forwards; }
  .hero{
    position:relative; border-radius:28px; overflow:hidden; margin-top:6px;
    background:linear-gradient(120deg,#aee0ff,#bfeede 60%,#fbe3f1);
    padding:38px 22px 30px; text-align:center;
    box-shadow:0 14px 40px rgba(110,160,200,.28);
  }
  .hero::before{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%); top:-90px; left:-60px; filter:blur(6px); }
  .hero::after{ content:""; position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(255,182,213,.55),transparent 70%); bottom:-80px; right:-50px; filter:blur(4px); }
  .avatar{
    position:relative; z-index:2; width:108px; height:108px; margin:0 auto 14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#e9d8f5 60%,#c9b3e0);
    display:flex; align-items:center; justify-content:center;
    border:4px solid #fff; box-shadow:0 0 0 6px rgba(255,255,255,.4),0 8px 22px rgba(0,0,0,.15);
    animation:float 3.6s ease-in-out infinite; overflow:hidden;
  }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .hero h1{ position:relative; z-index:2; font-size:28px; letter-spacing:2px; text-shadow:0 2px 8px rgba(255,255,255,.5); }
  .hero .sub{ position:relative; z-index:2; font-size:13px; color:#4a6378; margin-top:6px; }
  .tags{ position:relative; z-index:2; margin-top:14px; display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
  .tags span{ background:rgba(255,255,255,.75); color:var(--ink); font-size:12px; padding:5px 12px; border-radius:20px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .card{
    background:var(--card); backdrop-filter:blur(10px);
    border-radius:22px; padding:20px 18px 18px; margin-top:16px;
    box-shadow:0 8px 26px rgba(110,160,200,.16);
    border:1px solid rgba(255,255,255,.7); position:relative;
  }
  .card h2{ font-size:17px; margin-bottom:14px; display:flex; align-items:center; gap:9px; color:var(--ink); padding-left:12px; position:relative; }
  .card h2::before{ content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:5px; height:18px; border-radius:4px; background:linear-gradient(var(--accent),var(--accent2)); }
  .card h2 .ic{ font-size:20px; }
  .hobby{ display:flex; flex-wrap:wrap; gap:8px; }
  .hobby span{ background:linear-gradient(120deg,#e8f6ff,#eafaf1); color:#3a6a86; font-size:13px; padding:7px 13px; border-radius:14px; border:1px solid #cfe8f5; transition:.18s; }
  .hobby span:hover{ transform:translateY(-2px); box-shadow:0 5px 12px rgba(120,170,210,.25); }
  .games{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; }
  .game{ background:linear-gradient(120deg,#fff,#f3fafe); border:1px solid #e2eef6; border-radius:14px; padding:10px 12px; font-size:13px; display:flex; flex-direction:column; gap:3px; transition:.18s; position:relative; overflow:hidden; }
  .game::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .game.s-hot::before{ background:#ff8a5c; } .game.s-ok::before{ background:#5bbf8a; } .game.s-cold::before{ background:#9aa9b5; } .game.s-quit::before{ background:#c08ab0; }
